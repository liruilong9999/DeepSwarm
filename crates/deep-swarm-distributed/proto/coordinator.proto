syntax = "proto3";

package deepswarm.distributed.v1;

service CoordinatorRpc {
  rpc AcquireLease(Empty) returns (AcquireLeaseReply);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseReply);
  rpc SubmitResult(SubmitResultRequest) returns (SubmitResultReply);
  rpc GetState(Empty) returns (StateReply);
}

message Empty {}

message Lease {
  string run_id = 1;
  string task_id = 2;
  string input_hash = 3;
  uint32 attempt = 4;
  string lease_id = 5;
  uint64 random_seed = 6;
  uint64 expires_at = 7;
}

message AcquireLeaseReply {
  optional Lease lease = 1;
}

message RenewLeaseRequest {
  Lease lease = 1;
}

message RenewLeaseReply {
  bool renewed = 1;
  uint64 expires_at = 2;
}

message SubmitResultRequest {
  string run_id = 1;
  string task_id = 2;
  uint32 attempt = 3;
  string lease_id = 4;
  bytes result_json = 5;
  string output_hash = 6;
}

enum SubmitDisposition {
  SUBMIT_DISPOSITION_UNSPECIFIED = 0;
  SUBMIT_DISPOSITION_ACCEPTED = 1;
  SUBMIT_DISPOSITION_DROPPED_OLD_LEASE = 2;
  SUBMIT_DISPOSITION_DROPPED_DUPLICATE = 3;
}

message SubmitResultReply {
  SubmitDisposition disposition = 1;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 1;
  RUN_STATUS_SUCCEEDED = 2;
  RUN_STATUS_FAILED = 3;
}

message StateReply {
  RunStatus status = 1;
  repeated string failed_tasks = 2;
}

